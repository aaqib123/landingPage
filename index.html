<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal landing page for a custom domain."
    />
    <title>Your Name — Personal Domain</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      main {
        max-width: 680px;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your Name — Personal Domain</h1>
      <p>
        Welcome to my personal domain. This landing page is a simple starting
        point for sharing who I am and what I create.
      </p>
    </main>
  </body>
</html>
